name: Deploy Web App for iPhone

on:
  workflow_dispatch: # Allows you to run it anytime with 1 click

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Web Platform
        run: |
          flutter create . --project-name penny_tracker --org com.offline.penny --platforms=web

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web --base-href "/penny-expense-tracker/" --release

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
