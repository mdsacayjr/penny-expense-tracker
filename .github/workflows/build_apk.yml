name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Android Project Structure
        run: |
          flutter create . --project-name penny_tracker --org com.offline.penny --platforms=android

      - name: Install Dependencies
        run: flutter pub get

      # ==========================================================
      # HIGHLIGHT: Automatically generate Android home screen icon
      # ==========================================================
      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Penny-Expense-Tracker-APK
          path: build/app/outputs/flutter-apk/app-release.apk
