name: penny_tracker
description: "Offline AI-assisted expense tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.19.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # --- HIGHLIGHT: Launcher Icon Generator ---
  flutter_launcher_icons: ^0.13.1

# --- HIGHLIGHT: Icon Configuration ---
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "icon.png"

flutter:
  uses-material-design: true
  # --- HIGHLIGHT: Register Icon Asset ---
  assets:
    - icon.png
